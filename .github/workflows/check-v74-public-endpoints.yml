name: Comprobar Carrubo V74 publico sin emparejar
on:
  push:
    branches:
      - build/k2-v7-diagnostico
  workflow_dispatch:
jobs:
  reachability:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar rutas V74 sin gastar codigo real
        shell: bash
        run: |
          set -euo pipefail
          ROOT="https://carrubo-pos-demo.lovable.app"
          call() {
            local label="$1" expected="$2"; shift 2
            local code
            code=$(curl -sS --max-time 25 --retry 0 -o "/tmp/${label}.txt" -w '%{http_code}' "$@")
            echo "${label}=${code}"
            head -c 200 "/tmp/${label}.txt" || true
            echo ""
            if [ "$code" != "$expected" ]; then
              echo "::error::${label}: expected ${expected}, received ${code}"
              exit 1
            fi
          }
          call PAIR_GET 405 "$ROOT/api/public/k2/v74-demo/pair"
          call POLL_GET 405 "$ROOT/api/public/k2/v74-demo/poll"
          call ACK_GET 405 "$ROOT/api/public/k2/v74-demo/ack"
          call PAIR_INVALID_JSON 400 -X POST -H "Content-Type: application/json" --data '{}' "$ROOT/api/public/k2/v74-demo/pair"
          call POLL_NO_TOKEN 401 -X POST -H "Content-Type: application/json" --data '{}' "$ROOT/api/public/k2/v74-demo/poll"
          call KIOSK 200 "$ROOT/"
          echo "SUCCESS: routes publicly reachable, no real pairing attempted, no charge"
