name: Compilar Carrubo K2 V7 Diagnostico
on:
  push:
    branches:
      - build/k2-v7-diagnostico
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Android SDK con herramientas preexistentes del runner
        shell: bash
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK de diagnostico
        working-directory: android/k2-v7
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: SHA256 y APK generada
        run: |
          ls -l android/k2-v7/app/build/outputs/apk/debug/
          sha256sum android/k2-v7/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Carrubo-K2-V7-Diagnostico-APK
          path: android/k2-v7/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Verificar ruta DEMO en vista previa sin sesión
        if: always()
        shell: bash
        run: |
          code=$(curl -sS --max-time 20 -o /tmp/v7check.txt -w '%{http_code}' \
            'https://id-preview--66ed1f1d-568e-4eac-814b-9dc03afb9bfc.lovable.app/api/public/k2/v7-demo/claim' || echo '000')
          echo "V7_DEMO_PREVIEW_GET_HTTP=$code"
          if [ "$code" = "405" ]; then
            echo "Endpoint demo alcanzable sin login (405 esperado para GET)."
          else
            echo "::warning::Endpoint DEMO no verificado para APK; HTTP $code. No habilitar pruebas hasta resolver acceso."
          fi
