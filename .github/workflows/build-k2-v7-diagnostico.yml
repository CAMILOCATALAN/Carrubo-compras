name: Compilar Carrubo K2 V7 Diagnostico
on:
  push:
    branches:
      - build/k2-v7-diagnostico
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Instalar Android SDK
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK de diagnostico
        working-directory: android/k2-v7
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: SHA256 y APK generada
        run: |
          ls -l android/k2-v7/app/build/outputs/apk/debug/
          sha256sum android/k2-v7/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Carrubo-K2-V7-Diagnostico-APK
          path: android/k2-v7/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
