['quattro','Quattro Formaggi','Fior di latte, gorgonzola, provolone y Grana Padano',17900],
['parmigiana','Parmigiana','Tomate, fior di latte, berenjena, Grana y albahaca',14900],
['funghi','Funghi e Provolone','Fior di latte, provolone, champiñones y perejil',15900],
['ortolana','Ortolana','Tomate, fior di latte, berenjena, zapallo, pimentón y aceitunas',14900]];
var sides=[['palos-ajo','Palos de ajo para llevar','Porción a definir',3990,'🥖'],['palos-queso','Palos de queso','Porción a definir',4990,'🧀'],['empanaditas','Empanaditas de cóctel de queso','Porción a definir',4990,'🥟'],['nuggets','Nuggets','Porción a definir',4990,'🍗'],['papas','Papas fritas','Porción a definir',3990,'🍟']];
var drinks=[['lata','Bebida en lata','Marca y sabor a definir',1990,'🥤']];
var product={};pizzas.forEach(function(x){product[x[0]]={id:x[0],name:x[1],desc:x[2],price:x[3],cat:'pizzas',emoji:'🍕'}});sides.concat(drinks).forEach(function(x){product[x[0]]={id:x[0],name:x[1],desc:x[2],price:x[3],cat:x[0]==='lata'?'bebidas':'picar',emoji:x[4]}});
var promos=[
{id:'ajo',name:'Pizza & Ajo',emoji:'🍕🥖',p:1,s:[['palos-ajo']],d:0,off:8,desc:'1 pizza a elección + palos de ajo'},
{id:'queso',name:'Pizza & Queso',emoji:'🍕🧀',p:1,s:[['palos-queso']],d:1,off:10,desc:'1 pizza a elección + palos de queso + lata'},
{id:'crujiente',name:'Pizza & Crujientes',emoji:'🍕🍟',p:1,s:[['nuggets','empanaditas','papas']],d:1,off:10,desc:'1 pizza + nuggets, empanaditas o papas fritas + lata'},
{id:'duo',name:'Dúo de Pizzas',emoji:'🍕🍕',p:2,s:[],d:2,off:10,desc:'2 pizzas a elección + 2 bebidas en lata'},
{id:'compartir',name:'Dúo para Compartir',emoji:'🍕🥟',p:2,s:[['palos-ajo','palos-queso','nuggets','papas','empanaditas'],['palos-ajo','palos-queso','nuggets','papas','empanaditas']],d:2,off:12,desc:'2 pizzas + 2 acompañamientos a elección + 2 latas'},
{id:'festin',name:'Festín Carrubo',emoji:'🍕🍟',p:2,s:[['palos-ajo'],['palos-queso'],['papas'],['empanaditas']],d:2,off:12,desc:'2 pizzas + ajo + queso + papas + empanaditas + 2 latas'}];
var photoMap={"margherita":"https://images.unsplash.com/photo-1574071318508-1cdbab80d002?auto=format&fit=crop&w=700&q=80","marinara":"https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?auto=format&fit=crop&w=700&q=80","bufalina":"https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=700&q=80","napoli":"https://images.unsplash.com/photo-1593560708920-61dd98c46a4e?auto=format&fit=crop&w=700&q=80","diavola":"https://images.unsplash.com/photo-1571407970349-bc81e7e96d47?auto=format&fit=crop&w=700&q=80","capricciosa":"https://images.unsplash.com/photo-1520201163981-8cc95007dd2a?auto=format&fit=crop&w=700&q=80","crudo":"https://images.unsplash.com/photo-1594007654729-407eedc4be65?auto=format&fit=crop&w=700&q=80","mortadella":"https://images.unsplash.com/photo-1604382354936-07c5d9983bd3?auto=format&fit=crop&w=700&q=80","speck":"https://images.unsplash.com/photo-1628840042765-356cda07504e?auto=format&fit=crop&w=700&q=80","porchetta":"https://images.unsplash.com/photo-1548365328-9f547fb0953f?auto=format&fit=crop&w=700&q=80","finocchiona":"https://images.unsplash.com/photo-1565299507177-b0ac66763828?auto=format&fit=crop&w=700&q=80","quattro":"https://images.unsplash.com/photo-1579751626657-72bc17010498?auto=format&fit=crop&w=700&q=80","parmigiana":"https://images.unsplash.com/photo-1541745537411-b8046dc6d66c?auto=format&fit=crop&w=700&q=80","funghi":"https://images.unsplash.com/photo-1506354666786-959d6d497f1a?auto=format&fit=crop&w=700&q=80","ortolana":"https://images.unsplash.com/photo-1574071318508-1cdbab80d002?auto=format&fit=crop&w=700&q=80","palos-ajo":"https://images.unsplash.com/photo-1558961363-fa8fdf82db35?auto=format&fit=crop&w=700&q=80","palos-queso":"https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?auto=format&fit=crop&w=700&q=80","empanaditas":"https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=700&q=80","nuggets":"https://images.unsplash.com/photo-1562967914-608f82629710?auto=format&fit=crop&w=700&q=80","papas":"https://images.unsplash.com/photo-1573080496219-bb080dd4f877?auto=format&fit=crop&w=700&q=80","lata":"https://images.unsplash.com/photo-1622483767028-3f66f32aef97?auto=format&fit=crop&w=700&q=80"};
var storage='carrubo-pos-combos-demo-v1',screen='welcome',tab='pizzas',cart=[],draft=null,detail=null,mode='retiro',done='';
function money(n){return '$'+Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.')}
function esc(s){return String(s).replace(/[&<>"']/g,function(x){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]})}
function promo(id){return promos.filter(function(p){return p.id===id})[0]}
function validCombo(c){var p=promo(c.offer);if(!p||!Array.isArray(c.pizzas)||c.pizzas.length!==p.p||!Array.isArray(c.sides)||c.sides.length!==p.s.length)return false;return c.pizzas.every(function(x){return product[x]&&product[x].cat==='pizzas'})&&c.sides.every(function(x,i){return p.s[i].indexOf(x)>=0})}
function calc(c){var p=promo(c.offer);if(!p||!validCombo(c))return null;var price=c.pizzas.concat(c.sides).reduce(function(sum,id){return sum+product[id].price},p.d*product.lata.price);var discount=Math.round(price*p.off/100/10)*10;return {before:price,save:discount,after:price-discount,offer:p}}
function load(){try{var j=JSON.parse(localStorage.getItem(storage));if(Array.isArray(j.cart)){cart=j.cart.filter(function(c){if(!c||!Number.isInteger(c.qty)||c.qty<1||c.qty>20)return false;if(c.kind==='single')return !!product[c.id];if(c.kind==='combo')return validCombo(c);return false}).map(function(c){return c.kind==='combo'?{kind:'combo',offer:c.offer,pizzas:c.pizzas,sides:c.sides,qty:c.qty}:{kind:'single',id:c.id,qty:c.qty}})}if(j.mode==='mesa')mode='mesa'}catch(e){}}
function save(){try{localStorage.setItem(storage,JSON.stringify({cart:cart,mode:mode}))}catch(e){}}
function lineVal(c){return c.kind==='single'?product[c.id].price*c.qty:calc(c).after*c.qty}
function count(){return cart.reduce(function(n,c){return n+c.qty},0)}
function total(){return cart.reduce(function(n,c){return n+lineVal(c)},0)}
function savings(){return cart.reduce(function(n,c){return n+(c.kind==='combo'?calc(c).save*c.qty:0)},0)}
function nav(s,t){if(t)tab=t;screen=s;draft=null;detail=null;render();window.scrollTo(0,0)}
function button(txt,action,klass,disable){return '<button class="btn '+(klass||'')+'" data-act="'+esc(action)+'"'+(disable?' disabled':'')+'>'+txt+'</button>'}
function card(x){return '<article class="card"><button class="photo" style="border:0;padding:0;cursor:pointer" data-act="detail:'+x.id+'">'+productPhoto(x.id)+'</button><div class="inner"><h3>'+esc(x.name)+'</h3><p>'+esc(x.desc)+'</p><div class="price">'+money(x.price)+'</div><small class="muted">Precio de prueba</small>'+button('+ Agregar','add:'+x.id)+'</div></article>'}
function productPhoto(id){var u=photoMap[id]||photoMap.margherita;return '<img loading="lazy" decoding="async" src="'+esc(u)+'" alt="Fotografía ilustrativa de '+esc(product[id]?product[id].name:'pizza')+'" onerror="this.onerror=null;this.src=\'https://images.unsplash.com/photo-1574071318508-1cdbab80d002?auto=format&fit=crop&w=650&q=70\'">'}
function promoCard(p){var min=pizzas.reduce(function(n,x){return Math.min(n,x[3])},9999999);var bare=p.p*min+p.d*product.lata.price+p.s.reduce(function(n,a){return n+Math.min.apply(null,a.map(function(id){return product[id].price}))},0);var minPrice=bare-Math.round(bare*p.off/100/10)*10;return '<article class="card"><div class="photo promo-photo"><span class="tag">−'+p.off+'% DEMO</span>'+productPhoto('margherita')+productPhoto(p.s.length?p.s[0][0]:'diavola')+'</div><div class="inner"><h3>'+esc(p.name)+'</h3><p>'+esc(p.desc)+'</p><div class="save">Desde '+money(minPrice)+'</div><p>Ahorro según tus elecciones</p>'+button('Armar promoción','combo:'+p.id,'secondary')+'</div></article>'}
function welcome(){return '<section class="welcome"><div class="wbrand">RESTAURANTE<strong>Carrubo</strong></div><div class="wbottom"><h2>Pide aquí</h2><div><span class="pill">Pizza napolitana</span><span class="pill">Para llevar o comer aquí</span></div>'+button(count()?'CONTINUAR PEDIDO':'COMENZAR PEDIDO','start')+'<p class="sub">MODO DEMOSTRACIÓN · NO COBRA · FOTOGRAFÍAS ILUSTRATIVAS</p></div></section>'}
function detailSheet(){if(!detail)return '';var x=product[detail];return '<div class="overlay"><section class="sheet"><div class="head"><b>Detalle del producto</b><button class="close" data-act="closedetail">×</button></div><div class="detailsPicture">'+productPhoto(x.id)+'</div><div class="detailsText"><h2>'+esc(x.name)+'</h2><p>'+esc(x.desc)+'</p><strong class="price">'+money(x.price)+'</strong><p>Fotografía y precio ilustrativos.</p></div></section><div class="sheetActions">'+button('Agregar a mi pedido · '+money(x.price),'addandclose:'+x.id)+'</div></div>'}
function header(){return '<header class="top"><div class="brand"><b>Carrubo</b><span>PRECIOS Y DESCUENTOS<br>DE DEMOSTRACIÓN</span></div>'+(screen==='catalog'?'<nav class="tabs">'+[['pizzas','🍕','15 pizzas'],['promos','🎁','Promociones'],['picar','🍟','Para picar'],['bebidas','🥤','Bebidas']].map(function(t){return '<button class="tab '+(tab===t[0]?'active':'')+'" data-act="tab:'+t[0]+'"><b>'+t[1]+'</b>'+t[2]+'</button>'}).join('')+'</nav>':'')+'</header>'}
function bottom(){if(screen==='done')return '';return '<div class="foot"><div><small>'+count()+' artículo(s)</small><div><strong>'+money(total())+'</strong></div></div>'+button(screen==='catalog'?'Ver pedido →':screen==='cart'?'Continuar →':'SIMULAR PEDIDO',screen==='catalog'?'cart':screen==='cart'?'summary':'finish','secondary',count()===0)+'</div>'}
function catalog(){var items=tab==='pizzas'?pizzas.map(function(x){return product[x[0]]}):tab==='picar'?sides.map(function(x){return product[x[0]]}):drinks.map(function(x){return product[x[0]]});var h=tab==='promos'?'<h2>Promociones Carrubo</h2><p class="muted">Arma tu combo eligiendo las pizzas y acompañamientos que prefieras.</p>':'<h2>'+({pizzas:'Nuestras 15 pizzas',picar:'Para picar',bebidas:'Bebidas'})[tab]+'</h2>';return h+'<div class="hint">Fotos ilustrativas de referencia. Precios, porciones y descuentos de prueba.</div><div class="grid">'+(tab==='promos'?promos.map(promoCard).join(''):items.map(card).join(''))+'</div>'}
function cartPage(){if(!cart.length)return '<h2>Tu pedido</h2><p>Aún no agregas productos.</p>'+button('Volver a la carta','tab:pizzas');var h='<h2>Tu pedido</h2>';cart.forEach(function(c,i){if(c.kind==='single'){h+='<div class="cartitem"><h3>'+esc(product[c.id].name)+'</h3><div class="muted">'+money(product[c.id].price)+' c/u</div><div class="row"><b>'+money(lineVal(c))+'</b>'+stepper(i,c.qty)+'</div><button class="textbtn" data-act="del:'+i+'">Eliminar</button></div>'}else{var k=calc(c);h+='<div class="cartitem"><h3>🎁 '+esc(k.offer.name)+'</h3><p>'+c.pizzas.concat(c.sides).concat(Array(k.offer.d).fill('lata')).map(function(id){return esc(product[id].name)}).join(' · ')+'</p><div class="strike">Normal: '+money(k.before*c.qty)+'</div><div class="save">Ahorro: '+money(k.save*c.qty)+'</div><div class="row"><b>'+money(lineVal(c))+'</b>'+stepper(i,c.qty)+'</div><button class="textbtn" data-act="del:'+i+'">Eliminar promoción</button></div>'}});return h+button('+ Seguir comprando','tab:pizzas','outline')+'<div class="totals">'+totalLines()+'</div>'}
function stepper(i,n){return '<div class="stepper"><button aria-label="Restar" data-act="minus:'+i+'">−</button><b>'+n+'</b><button aria-label="Sumar" data-act="plus:'+i+'">+</button></div>'}
function totalLines(){return '<div class="line"><span>Total antes de descuentos</span><b>'+money(total()+savings())+'</b></div><div class="line save"><span>Descuentos promociones</span><b>−'+money(savings())+'</b></div><div class="line final"><span>Total</span><b>'+money(total())+'</b></div><small class="muted">Solo demostración. No se ha cobrado ningún importe.</small>'}
function summary(){return '<button class="navback" data-act="cart">← Editar pedido</button><h2>Resumen</h2>'+cartPage().replace('<h2>Tu pedido</h2>','')+'<h3>¿Cómo lo disfrutarás?</h3><div class="choices"><button class="choice '+(mode==='retiro'?'chosen':'')+'" data-act="mode:retiro">🛍️ Para llevar</button><button class="choice '+(mode==='mesa'?'chosen':'')+'" data-act="mode:mesa">🍽️ Comer aquí</button></div><p class="hint">Los pedidos NO se envían a cocina; las promociones y precios aún no están aprobados.</p>'}
function render(){var oldSheet=document.querySelector('.sheet'), oldTop=oldSheet?oldSheet.scrollTop:0;if(screen==='welcome'){document.getElementById('app').innerHTML=welcome();return}var main=screen==='catalog'?catalog():screen==='cart'?cartPage():screen==='summary'?summary():'<div class="hero"><h2>Pedido de prueba</h2><p>PRUEBA — NO SE ENVIÓ A COCINA NI SE COBRÓ.</p><h2>'+esc(done)+'</h2><p>Importe simulado: '+money(total())+'</p></div>'+button('Nuevo pedido','restart','secondary');document.getElementById('app').innerHTML=header()+'<main class="wrap">'+main+'</main>'+bottom()+(draft?drawer():'')+(detail?detailSheet():'');if(draft){var nextSheet=document.querySelector('.sheet');if(nextSheet)nextSheet.scrollTop=oldTop;}}
function drawer(){var p=promo(draft.offer), ready=validCombo(draft), n=ready?calc(draft):null;var html='<div class="overlay" id="overlay"><section class="sheet"><div class="head"><div><small class="save">PROMOCIÓN DE PRUEBA · −'+p.off+'%</small><h2>'+esc(p.name)+'</h2></div><button class="close" data-act="close" aria-label="Cerrar">×</button></div><p>'+esc(p.desc)+'</p><div class="slots">';
for(var i=0;i<p.p;i++){html+='<h3>🍕 Elige pizza '+(i+1)+'</h3><div class="choices">'+pizzas.map(function(x){return '<button class="choice '+(draft.pizzas[i]===x[0]?'chosen':'')+'" data-act="pickpizza:'+i+':'+x[0]+'">'+esc(x[1])+'<b>'+money(x[3])+'</b></button>'}).join('')+'</div>'}
for(var j=0;j<p.s.length;j++){html+='<h3>🍟 Acompañamiento '+(j+1)+'</h3><div class="choices">'+p.s[j].map(function(id){return '<button class="choice '+(draft.sides[j]===id?'chosen':'')+'" data-act="pickside:'+j+':'+id+'">'+esc(product[id].name)+'<b>'+money(product[id].price)+'</b></button>'}).join('')+'</div>'}
html+='</div>'+(p.d?'<p class="hint">Incluye '+p.d+' bebida(s) en lata.</p>':'')+'<div class="totals">'+(n?'<div class="line"><span>Precio normal</span><b>'+money(n.before)+'</b></div><div class="line save"><span>Ahorras ('+p.off+'%)</span><b>−'+money(n.save)+'</b></div><div class="line final"><span>Precio promoción</span><b>'+money(n.after)+'</b></div>':'<p>Completa las elecciones para ver el precio de tu combo.</p>')+'</div></section><div class="sheetActions">'+button(ready?'Agregar combo · '+money(n.after):'Selecciona todas las opciones','accept','secondary',!ready)+'</div></div>';return html}
function addSingle(id){var c=cart.filter(function(c){return c.kind==='single'&&c.id===id})[0];if(c){c.qty=Math.min(20,c.qty+1)}else cart.push({kind:'single',id:id,qty:1});save();render()}
function addCombo(){if(!validCombo(draft))return;var same=cart.filter(function(c){return c.kind==='combo'&&c.offer===draft.offer&&JSON.stringify(c.pizzas)===JSON.stringify(draft.pizzas)&&JSON.stringify(c.sides)===JSON.stringify(draft.sides)})[0];if(same)same.qty=Math.min(20,same.qty+1);else cart.push({kind:'combo',offer:draft.offer,pizzas:draft.pizzas.slice(),sides:draft.sides.slice(),qty:1});draft=null;save();render()}
document.body.addEventListener('click',function(e){var x=e.target.closest('[data-act]');if(!x)return;var a=x.getAttribute('data-act').split(':');if(a[0]==='start'){nav('catalog','pizzas');return}if(a[0]==='detail'&&product[a[1]]){detail=a[1];render();return}if(a[0]==='closedetail'){detail=null;render();return}if(a[0]==='addandclose'){detail=null;addSingle(a[1]);return}if(a[0]==='tab'){nav('catalog',a[1]);return}if(a[0]==='combo'){var p=promo(a[1]);draft={offer:p.id,pizzas:Array(p.p).fill(null),sides:p.s.map(function(z){return z.length===1?z[0]:null})};render();return}if(a[0]==='pickpizza'&&draft){draft.pizzas[+a[1]]=a[2];render();return}if(a[0]==='pickside'&&draft){draft.sides[+a[1]]=a[2];render();return}if(a[0]==='accept'){if(draft)addCombo();return}if(a[0]==='close'){draft=null;render();return}if(a[0]==='add'){addSingle(a[1]);return}if(a[0]==='del'){cart.splice(+a[1],1);save();render();return}if(a[0]==='minus'){if(cart[+a[1]]){cart[+a[1]].qty--;if(cart[+a[1]].qty<1)cart.splice(+a[1],1);save();render()}return}if(a[0]==='plus'){if(cart[+a[1]])cart[+a[1]].qty=Math.min(20,cart[+a[1]].qty+1);save();render();return}if(a[0]==='mode'){mode=a[1];save();render();return}if(a[0]==='finish'){done='DEMO-'+Math.floor(1000+Math.random()*9000);nav('done');return}if(a[0]==='restart'){cart=[];save();nav('welcome','pizzas');return}if(['cart','summary','catalog'].indexOf(a[0])>=0)nav(a[0])});
load();render();
})();
</script></body></html>
